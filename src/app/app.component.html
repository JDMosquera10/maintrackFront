<main class="main">
  <mat-drawer-container class="example-container" autosize="false">
    <mat-drawer #drawer class="example-sidenav" mode="side">
      <app-sidebar (actionComponent)="navegate($event, drawer)"></app-sidebar>
      <div class="gradient-divider"></div>
    </mat-drawer> 

    <div class="example-sidenav-content">
      @if (showFilterImage) {
      <img [src]="logoUrl" style="width: 100%; height: 100%;" alt="Sidebar image">
      } @else {
      <div class="router-outlet" [class.login-route]="isLoginRoute">
        <router-outlet></router-outlet>
      </div>

      <!-- Botón de menú expandible -->
      <div *ngIf="authService.isAuthenticated() | async" class="menu-container">

        <!-- Botón principal del menú -->
        <button mat-fab aria-label="Menu lateral" class="button-menu" (click)="toggleMenu(drawer)">
          <mat-icon>menu</mat-icon>
        </button>

        <!-- Navegación rápida - siempre visible cuando el menú está cerrado -->
        <div class="quick-nav" [class.visible]="!isMenuOpen">
          <div class="quick-nav-icons">
            @for (module of quickNavModulesFiltered; track module.path) {
            <button mat-mini-fab class="quick-nav-button" [title]="module.title" (click)="navigateQuick(module.path)">
              <mat-icon>{{ module.icon }}</mat-icon>
            </button>
            }

            <!-- Botón de cambio de tema - Solo se muestra si hay más de un tema disponible -->
            @if (shouldShowThemeToggle()) {
            <button mat-mini-fab class="quick-nav-button theme-toggle-button" [title]="getThemeTooltip()"
              (click)="toggleTheme()">
              <mat-icon>{{ getThemeIcon() }}</mat-icon>
            </button>
            }

            <!-- Botón de logout -->
            <button mat-mini-fab class="quick-nav-button logout-button" title="Cerrar sesión" (click)="logout()">
              <mat-icon>logout</mat-icon>
            </button>
          </div>
        </div>
      </div>
      }
    </div>
  </mat-drawer-container>

  <!-- Componente de loading global -->
  <app-loading></app-loading>
</main>
